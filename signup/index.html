<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Start free trial | Simple Floww</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<link rel="stylesheet" href="/assets/style.css?v=7">
<style>
  body{background:var(--tint);min-height:100vh;display:flex;flex-direction:column}
  .auth{flex:1;display:flex;align-items:center;justify-content:center;padding:32px max(20px,env(safe-area-inset-left,0px))}
  .auth-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:32px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 50px rgba(1,11,72,.08)}
  .auth-card h1{font-size:28px}
  .demo-note{background:#fff7e6;border:1px solid #fde3a7;color:#6b4300;border-radius:12px;padding:10px 14px;font-size:14px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-weight:600;font-size:14px}
  .field input{border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:16px;min-height:48px}
  .field input:focus{outline:2px solid var(--royal);outline-offset:1px}
  .full{width:100%;justify-content:center}
  .perks{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--ink-2)}
  .foot{text-align:center;font-size:14px;color:var(--ink-2)}
  .foot a{color:var(--royal);font-weight:600}
</style>
</head>
<body>
<div class="auth">
  <main class="auth-card">
    <a href="/" aria-label="Simple Floww home"><img src="/assets/logo.png" alt="Simple Floww" width="183" height="27"></a>
    <h1>Start your 7-day free trial</h1>
    <div class="perks"><span>✓ No card needed</span><span>✓ AI sets up your account</span><span>✓ Help in Hindi and English</span></div>
    <p class="demo-note"><b>Demo version.</b> Fill anything you like. Nothing is saved or sent. You will land on the AI setup screen.</p>
    <form id="signup" class="field" style="gap:14px" novalidate>
      <div class="field"><label for="name">Your name</label><input id="name" autocomplete="off" placeholder="Abhinandan Kumar"></div>
      <div class="field"><label for="biz">Business name</label><input id="biz" autocomplete="off" placeholder="Simple Floww"></div>
      <div class="field"><label for="mob">Mobile number</label><input id="mob" inputmode="tel" autocomplete="off" placeholder="+91 98XXX XXXXX"></div>
      <div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="off" placeholder="you@business.com"></div>
      <button class="btn btn-pri full" type="submit">Create account</button>
    </form>
    <p class="foot">Already have an account? <a href="/login/">Log in</a></p>
  </main>
</div>
<script>
document.getElementById('signup').addEventListener('submit', function(e){ e.preventDefault(); location.href = '/app/#setup'; });
</script>
</body>
</html>
