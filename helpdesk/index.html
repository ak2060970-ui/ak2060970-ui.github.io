<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<body>
<title>Simple Floww Helpdesk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --navy:#0a0f47; --blue:#0a1ef5; --cyan:#06d6fa; --green:#25d366;
  --cloud:#f4f8ff; --line:#dfe5f5; --line2:#edf1fa; --slate:#4a5275; --tint:#e7eafe; --tint2:#def8fe;
  --warn-bg:#fff1de; --warn:#8a4b00; --bad-bg:#fde8ea; --bad:#a3262f; --ok-bg:#e3f9eb; --ok:#0b6b34;
  --f-display:"Plus Jakarta Sans","Helvetica Neue",Arial,sans-serif; --f-body:Inter,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cloud)}
body{font-family:var(--f-body);color:var(--navy);font-size:14.5px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.h{font-family:var(--f-display);margin:0;font-weight:800;letter-spacing:-.3px}
h1.h{font-size:26px}
.muted{color:var(--slate)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column}
.card{background:#fff;border:1px solid var(--line);border-radius:16px}
.btn{border:1px solid #cfd7f0;background:#fff;border-radius:10px;min-height:40px;padding:0 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:#b3bfe6}
.btn-p{background:var(--blue);border-color:var(--blue);color:#fff}.btn-p:hover{background:#0816c4}
.btn-g{background:var(--green);border-color:var(--green);color:var(--navy)}
.btn-q{border-color:transparent;background:transparent}
.btn-sm{min-height:32px;padding:0 10px;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.p-blue{background:var(--tint);color:var(--blue)}.p-cyan{background:var(--tint2);color:var(--navy)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-bad{background:var(--bad-bg);color:var(--bad)}.p-ok{background:var(--ok-bg);color:var(--ok)}.p-grey{background:#f1f2f6;color:var(--slate)}
.chip{border:1px solid #cfd7f0;background:#fff;border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:600;min-height:36px;white-space:nowrap}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;background:#eef1fa;border-radius:999px;padding:3px;gap:2px;flex:none}
.seg button{border:0;background:none;border-radius:999px;padding:5px 13px;font-weight:600;font-size:13.5px;min-height:32px;color:var(--slate);white-space:nowrap}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(1,11,72,.14)}
.seg .n{margin-left:5px;font-size:12px;opacity:.7}
.listpane .segbar{padding:12px 12px 0;flex:none}
.split{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--line2)}
.split button{border:0;padding:0;height:100%}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip .n{margin-left:6px;font-size:12px;opacity:.8}
.inp{border:1px solid #cfd7f0;border-radius:10px;padding:10px 12px;font-size:14px;background:#fff;min-height:42px;width:100%}
textarea.inp{resize:vertical}
.lbl{font-size:13px;font-weight:600;display:block;margin-bottom:6px}
.sw{width:44px;height:26px;border-radius:999px;border:0;position:relative;flex:none;background:#cfd7f0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:999px;background:#fff;transition:left .15s}
.sw.on{background:var(--blue)}.sw.on::after{left:21px}
.sw[disabled]{opacity:.6;cursor:not-allowed}
.av{border-radius:999px;background:var(--tint);color:var(--blue);display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--slate);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--blue);border-color:var(--blue)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;letter-spacing:.4px;text-transform:uppercase;color:var(--slate);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);background:#fafbff}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:#fafbff}
.tblwrap{overflow-x:auto}

/* shell */
.app{display:flex;min-height:100vh}
.side{flex:0 0 248px;background:#fff;border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{font-family:var(--f-display);font-size:20px;font-weight:800;padding:0 6px}
.brand small{display:block;font-family:var(--f-body);font-size:11.5px;font-weight:600;letter-spacing:1px;color:var(--blue)}
.switch{width:100%;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--cloud);border-radius:10px;min-height:40px;padding:0 12px;font-weight:600}
.pop{position:absolute;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px -16px rgba(10,15,71,.3);padding:6px;z-index:60}
.navlist{display:flex;flex-direction:column;gap:2px}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;border-radius:10px;padding:9px 10px;font-weight:600;color:var(--slate);text-align:left;text-decoration:none;font-size:14.5px}
.navbtn:hover{background:var(--cloud);color:var(--navy)}
.navbtn.on{background:var(--tint);color:var(--blue)}
.navbtn .lab{flex:1}
.navbtn .b{background:var(--blue);color:#fff;border-radius:999px;font-size:11.5px;padding:1px 8px}
.navbtn .b.red{background:#e5484d}
.sep{height:1px;background:var(--line);margin:6px 4px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:12px 24px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--cloud);border-radius:10px;padding:0 12px;min-height:40px;color:var(--slate)}
.search input{border:0;background:transparent;outline:none;flex:1;min-width:0}
.content{padding:24px;display:flex;flex-direction:column;gap:20px;min-width:0}
.dot{width:9px;height:9px;border-radius:99px;display:inline-block;flex:none}
.bell-b{position:absolute;top:4px;right:4px;background:#e5484d;color:#fff;border-radius:999px;font-size:10px;font-weight:700;min-width:16px;line-height:16px;text-align:center;padding:0 4px}
.toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:90;max-width:360px}
.toast{background:var(--navy);color:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 18px 40px -16px rgba(10,15,71,.5);display:flex;gap:10px;align-items:flex-start;font-size:14px}
.toast b{display:block}
.toast button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:8px;padding:4px 10px;font-weight:600;font-size:13px;margin-top:6px}

/* inbox */
.inbox{display:grid;grid-template-columns:330px minmax(0,1fr) 290px;gap:0;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;height:calc(100vh - 118px);min-height:560px}
.listpane{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.listpane .filters{padding:12px;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;flex:none}
.conv-list{overflow-y:auto;flex:1}
.conv{display:flex;gap:10px;padding:12px 14px;border:0;border-bottom:1px solid var(--line2);background:#fff;width:100%;text-align:left;align-items:flex-start}
.conv:hover{background:#fafbff}
.conv.on{background:var(--tint)}
.conv .nm{font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .pv{font-size:13px;color:var(--slate);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatpane{display:flex;flex-direction:column;min-width:0;min-height:0}
.chat-top{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
.thread{flex:1;overflow-y:auto;background:var(--cloud);padding:16px;display:flex;flex-direction:column;gap:10px;min-height:0}
.msg{max-width:78%;border-radius:14px;padding:9px 12px;font-size:14.5px;line-height:1.45;background:#fff;border:1px solid var(--line)}
.msg small{display:block;font-size:11.5px;color:var(--slate);margin-bottom:2px;font-weight:600}
.msg .at{display:block;font-size:11px;color:var(--slate);text-align:right;margin-top:3px}
.m-customer{align-self:flex-start;border-top-left-radius:4px}
.m-ai{align-self:flex-end;background:var(--tint2);border-color:#c5eef8;border-top-right-radius:4px}
.m-agent{align-self:flex-end;background:var(--blue);border-color:var(--blue);color:#fff;border-top-right-radius:4px}
.m-agent small,.m-agent .at{color:#cdd4ff}
.m-note{align-self:center;background:#fff8e6;border:1px dashed #f0c97a;max-width:90%}
.m-sys{align-self:center;background:transparent;border:0;color:var(--slate);font-size:12.5px;font-weight:600;padding:2px 8px;text-align:center}
.handoff{align-self:stretch;max-width:none;background:#fff;border:1px solid #ffd9a8;border-left:4px solid #f59e0b}
.composer{border-top:1px solid var(--line);padding:10px 12px 12px;flex:none;position:relative;background:#fff}
.composer textarea{width:100%;border:1px solid #cfd7f0;border-radius:12px;padding:10px 12px;min-height:64px;resize:none;outline:none;font-size:14.5px}
.composer.note textarea{background:#fff8e6;border-color:#f0c97a}
.srpop{position:absolute;left:12px;right:12px;bottom:100%;margin-bottom:6px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px -16px rgba(10,15,71,.3);padding:6px;max-height:260px;overflow-y:auto;z-index:20}
.srpop button{display:block;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:8px 10px}
.srpop button:hover{background:var(--cloud)}
.detpane{border-left:1px solid var(--line);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;min-height:0}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--line2)}
.kv span:first-child{color:var(--slate)}
.kv span:last-child{text-align:right;font-weight:600;min-width:0;overflow-wrap:anywhere}
.m-only{display:none!important}
.scrim{display:none}
.tabbar{display:none}

@media (max-width:1180px){
  .inbox{grid-template-columns:300px minmax(0,1fr)}
  .detpane{display:none}
  .inbox.show-details .detpane{display:flex;position:fixed;top:0;right:0;bottom:0;width:min(340px,92vw);background:#fff;z-index:70;box-shadow:-20px 0 50px rgba(10,15,71,.25)}
  .d-wide{display:inline-flex!important}
}
.d-wide{display:none!important}
@media (max-width:820px){
  .m-only{display:inline-flex!important}
  .d-only{display:none!important}
  .app{display:block}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(290px,86vw);z-index:80;transform:translateX(-105%);transition:transform .2s;height:auto;box-shadow:0 20px 50px rgba(10,15,71,.25)}
  .side.open{transform:none}
  .scrim{display:block;position:fixed;inset:0;background:rgba(10,15,71,.45);z-index:75}
  .top{padding:8px 12px}
  .search{display:none}
  .content{padding:14px 14px 96px}
  h1.h{font-size:22px}
  .inbox{grid-template-columns:1fr;height:calc(100vh - 160px);border-radius:14px}
  .inbox .chatpane{display:none}
  .inbox.show-chat .listpane{display:none}
  .inbox.show-chat .chatpane{display:flex}
  .msg{max-width:88%}
  .chat-top{flex-wrap:nowrap;padding:8px 10px;gap:6px}
  .ct-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ct-sub{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .composer{padding:8px 10px 10px}
  .composer textarea{min-height:44px}
  .composer .tab{padding:6px 8px;font-size:13px}
  .composer > .row:last-child{flex-wrap:nowrap}
  .inbox{height:calc(100vh - 150px)}
  .tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:6px 6px max(8px,env(safe-area-inset-bottom,0px));z-index:50}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--slate);min-height:50px;border-radius:10px;position:relative}
  .tabbar button.on{color:var(--blue);background:var(--tint)}
  .tabbar .b{position:absolute;top:2px;left:50%;margin-left:6px;background:#e5484d;color:#fff;border-radius:999px;font-size:10px;line-height:16px;min-width:16px;padding:0 4px}
  .toasts{left:12px;right:12px;bottom:84px;max-width:none}
  .tbl-cards thead{display:none}
  .tbl-cards tr{display:block;border-bottom:1px solid var(--line);padding:8px 0}
  .tbl-cards td{display:flex;justify-content:space-between;gap:10px;border:0;padding:5px 14px}
  .tbl-cards td::before{content:attr(data-label);color:var(--slate);font-size:12.5px}
  .tbl-cards td:first-child::before{content:none}
}
@media (prefers-reduced-motion:reduce){.side,.sw::after{transition:none}}
</style>

function bubble(m){
  if(m.f==='sys') return `<div class="msg m-sys">${esc(m.t)}</div>`;
  if(m.f==='note') return `<div class="msg m-note"><small>Internal note · ${m.who} · only your team sees this</small>${esc(m.t)}<span class="at">${m.at}</span></div>`;
  const who=m.f==='ai'?'AI agent':m.f==='agent'?(m.who||ME):'';
  return `<div class="msg m-${m.f}">${who?`<small>${who}</small>`:''}${esc(m.t)}<span class="at">${m.at}${m.wa?' · also sent on WhatsApp':''}</span></div>`;
}
function chatPane(c){
  const canReply=c.status!=='resolved';
  return `<div class="chatpane">
    <div class="chat-top">
      <button class="btn btn-q m-only" style="width:36px;padding:0" aria-label="Back to list" data-a="m-back">${ic('back')}</button>
      <span class="av" style="width:40px;height:40px;font-size:13px">${ini(c.name)}</span>
      <div style="flex:1;min-width:0"><b class="ct-name" style="display:block">${esc(c.name)}${c.company?` <span class="muted" style="font-weight:500">· ${esc(c.company)}</span>`:''}</b><span class="muted ct-sub" style="font-size:12.5px">${c.ticket?c.ticket+' · ':''}${esc(c.subject)}</span></div>
      <button class="btn btn-sm d-wide" data-a="m-details">${ic('info',16)} Details</button>
      <button class="btn btn-sm m-only" data-a="m-details" aria-label="Details">${ic('info',16)}</button>
      ${c.status==='ai'?`<button class="btn btn-sm btn-p" data-a="takeover">Take over</button>`:''}
      ${c.status!=='resolved'&&c.status!=='ai'?`<button class="btn btn-sm btn-g" data-a="resolve">${ic('check',16,2.4)} Resolve</button>`:''}
      ${c.status==='resolved'?`<button class="btn btn-sm" data-a="reopen">Reopen</button>`:''}
    </div>
    ${c.status==='ai'?`<div style="background:var(--tint2);padding:8px 16px;font-size:13px;font-weight:600;flex:none">The AI agent is replying in this chat. Type below or press Take over to reply yourself.</div>`:''}
    ${c.status==='human'&&c.reason?`<div style="background:var(--bad-bg);color:#7a1520;padding:8px 16px;font-size:13px;font-weight:600;flex:none">Handed to a person: ${esc(c.reason)} · reply due ${c.wait>=c.sla?'now (overdue)':'in '+(c.sla-c.wait)+' min'}</div>`:''}
    <div class="thread" id="thread">${c.msgs.map(bubble).join('')}</div>
    ${canReply?`<form id="replyf" class="composer${S.mode==='note'?' note':''}">
      ${S.srOpen?`<div class="srpop" role="listbox" aria-label="Saved replies">${SAVED.map(([l,t],i)=>`<button type="button" data-a="saved" data-v="${i}"><b style="display:block;font-size:13.5px">/${l.toLowerCase().replace(/\s+/g,'-')}</b><span class="muted" style="font-size:13px">${esc(t)}</span></button>`).join('')}</div>`:''}
      <div class="row" style="gap:4px;margin-bottom:8px"><button type="button" class="tab${S.mode==='reply'?' on':''}" data-a="mode" data-v="reply">Reply to customer</button><button type="button" class="tab${S.mode==='note'?' on':''}" data-a="mode" data-v="note">Internal note</button></div>
      <textarea id="draft" placeholder="${S.mode==='note'?'Only your team will see this note':'Type a reply, or / for saved replies'}" aria-label="Message">${esc(S.draft)}</textarea>
      <div class="row" style="justify-content:space-between;margin-top:8px">
        <span class="row" style="gap:8px">${S.mode==='reply'?`<button type="button" class="btn btn-sm" data-a="sr">Saved replies</button>${c.phone?`<label class="row" style="gap:6px;font-size:13px;font-weight:600;cursor:pointer"><input type="checkbox" id="wa" ${S.wa?'checked':''}> Also send on WhatsApp</label>`:''}`:''}</span>
        <button class="btn btn-p" type="submit">${ic('send',16,2)} ${S.mode==='note'?'Add note':'Send'}</button></div>
    </form>`:`<div class="composer muted" style="text-align:center;font-size:13.5px">This chat is resolved${c.csat?` · Customer rated ${'★'.repeat(c.csat)}`:''}. Reopen it to reply.</div>`}
  </div>`;
}

    <label><span class="lbl">Status</span><select class="inp" id="d-status">${Object.entries(STATUS).map(([k,[l]])=>`<option value="${k}"${c.status===k?' selected':''}>${l}</option>`).join('')}</select></label>
    <label><span class="lbl">Assigned to</span><select class="inp" id="d-owner">${people.map(p=>`<option value="${p}"${c.owner===p?' selected':''}>${p?p+(p===ME?' (you)':''):'Unassigned'}</option>`).join('')}</select></label>
    <div class="row" style="gap:10px;flex-wrap:nowrap"><label style="flex:1;min-width:0"><span class="lbl">Team</span><select class="inp" id="d-team">${['Sales','Support'].map(t=>`<option${c.team===t?' selected':''}>${t}</option>`).join('')}</select></label>
      <label style="flex:1;min-width:0"><span class="lbl">Priority</span><select class="inp" id="d-prio">${['Low','Normal','High','Urgent'].map(t=>`<option${c.prio===t?' selected':''}>${t}</option>`).join('')}</select></label></div>

// ---------- tickets ----------
function tickets(){
  const all=CONVS.filter(c=>c.ticket), rows=all.filter(inDept);
  const open=rows.filter(c=>c.status!=='resolved').length;
  return `<div class="row" style="justify-content:space-between"><div><h1 class="h">Tickets</h1><p class="muted" style="margin:4px 0 0">Every chat that went to a person becomes a ticket · ${open} open</p></div>
      <button class="btn btn-p" data-a="toast" data-v="New ticket form opens here">+ New ticket</button></div>
    <div>${deptSeg(all)}</div>
    <div class="card tblwrap"><table class="tbl tbl-cards"><thead><tr><th>Ticket</th><th>Customer</th><th>Team</th><th>Priority</th><th>Assigned</th><th>Status</th><th>Reply due</th></tr></thead><tbody>
      ${rows.map(c=>{const late=c.status==='human'&&c.wait>=c.sla;return `<tr class="click" data-a="open" data-v="${c.id}" tabindex="0">
        <td><b>${c.ticket}</b><div class="muted" style="font-size:12.5px">${esc(c.subject)}</div></td>
        <td data-label="Customer">${esc(c.name)}</td><td data-label="Team">${c.team}</td>
        <td data-label="Priority"><span class="pill ${c.prio==='High'||c.prio==='Urgent'?'p-bad':'p-grey'}">${c.prio}</span></td>
        <td data-label="Assigned">${c.owner||'<span class="muted">Unassigned</span>'}</td>
        <td data-label="Status"><span class="pill ${STATUS[c.status][1]}">${STATUS[c.status][0]}</span></td>
        <td data-label="Reply due" style="${late?'color:var(--bad);font-weight:600':''}">${c.status==='human'?(late?'Overdue':'in '+(c.sla-c.wait)+' min'):c.status==='waiting'?'Auto follow-up in 24 h':'—'}</td></tr>`}).join('')||'<tr><td colspan="7" class="muted">No tickets here.</td></tr>'}
    </tbody></table></div>`;
}

// ---------- FAQs & AI training ----------
function kb(){
  const tabs=[['faqs','FAQs · '+FAQS.length],['unanswered','Not answered · '+UNANSWERED.length],['sources','Sources']];
  let body='';
  if(S.kbTab==='faqs') body=`${S.faqNew!==null?faqForm():''}<div class="stack" style="gap:10px">${FAQS.map((f,i)=>`<div class="card" style="padding:14px 16px"><div class="row" style="justify-content:space-between;flex-wrap:nowrap;align-items:flex-start"><b style="flex:1">${esc(f.q)}</b><span class="pill p-grey">${f.cat}</span></div><p class="muted" style="margin:6px 0 8px">${esc(f.a)}</p><div class="row" style="justify-content:space-between"><span class="muted" style="font-size:12.5px">Used by the AI ${f.used} times</span>${owner()?`<button class="btn btn-sm" data-a="faqdel" data-v="${i}">Remove</button>`:''}</div></div>`).join('')}</div>`;
  if(S.kbTab==='unanswered') body=`${S.faqNew!==null?faqForm():''}<p class="muted" style="margin:0">Questions the AI could not answer. Add an answer once, and the AI uses it from then on.</p>
    <div class="card">${UNANSWERED.map((u,i)=>`<div class="row" style="justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line2)"><span><b>${esc(u.q)}</b><span class="muted" style="display:block;font-size:12.5px">Asked ${u.n} times this week</span></span><button class="btn btn-sm btn-p" data-a="answer" data-v="${i}">Add answer</button></div>`).join('')||'<p class="muted" style="padding:16px;margin:0">Nothing left. The AI can answer everything asked this week.</p>'}</div>`;
  if(S.kbTab==='sources') body=`<p class="muted" style="margin:0">The AI reads these to answer customers. It never makes up prices or policies.</p>
    <div class="card">${[['Website','simplefloww.com · 14 pages','Synced 2 hours ago'],['PDF','Price list Nov 2026.pdf','Uploaded 3 Nov'],['PDF','Setup guide.pdf','Uploaded 28 Oct'],['FAQs',FAQS.length+' questions and answers','Updated today']].map(([t,n,s])=>`<div class="row" style="justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line2)"><span class="row" style="gap:12px;flex-wrap:nowrap"><span class="pill p-blue">${t}</span><span><b>${n}</b><span class="muted" style="display:block;font-size:12.5px">${s}</span></span></span>${t==='Website'?'<button class="btn btn-sm" data-a="toast" data-v="Website sync started">Sync now</button>':''}</div>`).join('')}</div>
    ${owner()?'<div class="row"><button class="btn" data-a="toast" data-v="Add a website link here">+ Add website link</button><button class="btn" data-a="toast" data-v="Upload a PDF here">+ Upload PDF</button></div>':''}`;
  return `<div class="row" style="justify-content:space-between"><div><h1 class="h">FAQs &amp; AI training</h1><p class="muted" style="margin:4px 0 0">What the AI agent knows. Better answers here mean fewer chats for your team.</p></div>
      ${owner()?'<button class="btn btn-p" data-a="faqnew">+ Add FAQ</button>':''}</div>
    <div class="tabs" role="tablist">${tabs.map(([id,l])=>`<button class="tab${S.kbTab===id?' on':''}" role="tab" aria-selected="${S.kbTab===id}" data-a="kbtab" data-v="${id}">${l}</button>`).join('')}</div>
    ${body}`;
}

// ---------- AI agent ----------

  const rule=(k,l,s,locked)=>`<div class="row" style="justify-content:space-between;flex-wrap:nowrap;padding:12px 0;border-top:1px solid var(--line2)"><span><b style="display:block">${l}</b><span class="muted" style="font-size:13px">${s}</span></span><button class="sw${S.rules[k]?' on':''}" data-a="rule" data-v="${k}" aria-label="${l}" aria-pressed="${S.rules[k]}" ${locked?'disabled':''}></button></div>`;
  return `<div><h1 class="h">AI agent</h1><p class="muted" style="margin:4px 0 0">How the AI talks to customers and when it brings in your team</p></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start">
      <section class="card stack" style="padding:18px;gap:12px"><h2 class="h" style="font-size:16px">Basics</h2>
        <label><span class="lbl">Agent name (shown in the widget)</span><input class="inp" id="ag-name" value="${esc(S.agentName)}"></label>
        <label><span class="lbl">Greeting</span><input class="inp" value="Hi there! How can I help you today?"></label>
        <label><span class="lbl">Tone</span><select class="inp" id="ag-tone">${['Friendly','Formal','Short and simple'].map(t=>`<option${S.tone===t?' selected':''}>${t}</option>`).join('')}</select></label>
        <label><span class="lbl">Languages</span><input class="inp" value="English, Hindi, Hinglish"></label>
        <div class="row" style="justify-content:space-between;flex-wrap:nowrap"><span><b style="display:block">Show "Talk to Sales" button</b></span><button class="sw${S.btnSales?' on':''}" data-a="tog" data-v="btnSales" aria-label="Talk to Sales button"></button></div>
        <div class="row" style="justify-content:space-between;flex-wrap:nowrap"><span><b style="display:block">Show "Talk to Support" button</b></span><button class="sw${S.btnSupport?' on':''}" data-a="tog" data-v="btnSupport" aria-label="Talk to Support button"></button></div>
        <div class="row" style="justify-content:space-between;flex-wrap:nowrap"><span><b style="display:block">Ask name and mobile before a person joins</b><span class="muted" style="font-size:13px">So your team can reply on WhatsApp later</span></span><button class="sw${S.askPhone?' on':''}" data-a="tog" data-v="askPhone" aria-label="Ask for mobile number"></button></div>
        <button class="btn btn-p" data-a="saveagent" style="align-self:flex-start">Save changes</button>
      </section>
      <section class="card stack" style="padding:18px;gap:0"><h2 class="h" style="font-size:16px;margin-bottom:6px">Hand over to a person when…</h2>
        ${rule('person','The customer asks for a person','Always on, so customers are never stuck with the bot',true)}
        ${rule('notSure','The AI is not sure of the answer','Better to hand over than give a wrong answer')}
        ${rule('angry','The customer sounds upset','Complaints and angry words go to a person')}
        ${rule('payment','It is about payment or a refund','Money questions always reach your billing team')}

        <p class="muted" style="margin:0;font-size:13.5px">Live on simplefloww.com · 10 pages</p>
        <code style="display:block;background:var(--cloud);border-radius:10px;padding:10px 12px;font-size:12.5px;overflow-wrap:anywhere">&lt;script async src="https://apiauto.simplefloww.com/api/v1/widget/embed.js" data-agent-id="6a71…0bc7"&gt;&lt;/script&gt;</code>

      ${[['round','Take turns (round robin)','Each new chat goes to the next online person in that team'],['least','Fewest open chats','The person with the least work gets the next chat'],['manual','Manual','Chats wait in "Needs a person" until someone picks them']].map(([v,l,s])=>`<label class="row" style="flex-wrap:nowrap;gap:12px;border:1px solid ${S.assign===v?'var(--blue)':'var(--line)'};border-radius:12px;padding:12px 14px;cursor:pointer;${S.assign===v?'background:#f6f8ff':''}"><input type="radio" name="assign" value="${v}" ${S.assign===v?'checked':''} data-a="assign" data-v="${v}"><span><b style="display:block">${l}</b><span class="muted" style="font-size:13px">${s}</span></span></label>`).join('')}

// ---------- notifications & reminders ----------
function alerts(){
  const num=(k,suf)=>`<input class="inp" type="number" min="1" style="width:84px;display:inline-block;min-height:36px;padding:6px 10px" value="${S.remind[k]}" data-k="${k}" aria-label="${suf}"> ${suf}`;
  const ch=(k,l)=>`<div class="row" style="justify-content:space-between;flex-wrap:nowrap;padding:10px 0;border-top:1px solid var(--line2)"><b>${l}</b><button class="sw${S.ch[k]?' on':''}" data-a="ch" data-v="${k}" aria-label="${l}" aria-pressed="${S.ch[k]}"></button></div>`;
  return `<div><h1 class="h">Notifications &amp; reminders</h1><p class="muted" style="margin:4px 0 0">So no customer waits too long</p></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start">
      <section class="card stack" style="padding:18px;gap:14px"><h2 class="h" style="font-size:16px">Reminders</h2>
        <div><b style="display:block">Remind the assigned person if there is no reply after</b><div style="margin-top:6px">${num('first','minutes')}</div></div>
        <div><b style="display:block">Alert the owner if there is still no reply after</b><div style="margin-top:6px">${num('owner','minutes')}</div></div>
        <div><b style="display:block">If the customer does not reply, send a follow-up after</b><div style="margin-top:6px">${num('follow','hours')}</div></div>
        <div><b style="display:block">Close the chat automatically after</b><div style="margin-top:6px">${num('close','days of no reply')}</div></div>
        <button class="btn btn-p" style="align-self:flex-start" data-a="saverem">Save reminders</button>
      </section>
      <section class="card stack" style="padding:18px;gap:0"><h2 class="h" style="font-size:16px;margin-bottom:6px">Where your team gets notified</h2>
        ${ch('sound','Sound and pop-up in the browser')}${ch('app','Mobile app')}${ch('wa','WhatsApp message')}${ch('email','Email')}
        <p class="muted" style="margin:12px 0 0;font-size:13px">You are notified when: a chat needs a person, a chat is assigned to you, a customer replies, or a reply is overdue.</p>
      </section>
    </div>`;
}

    <div class="row" style="justify-content:space-between">${deptSeg()}${d==='all'?'<span class="muted" style="font-size:13px">Sales 236 chats (57%) · Support 176 chats (43%)</span>':''}</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px">${kp.map(([l,v])=>`<div class="card" style="padding:14px 16px"><span class="muted" style="font-size:12.5px;font-weight:600">${l}</span><div style="font-family:var(--f-display);font-size:24px;font-weight:800">${v}</div></div>`).join('')}</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start">
      <section class="card stack" style="padding:18px;gap:10px"><h2 class="h" style="font-size:16px">Why the AI handed over</h2>
        ${why.map(([l,p])=>`<div class="row" style="flex-wrap:nowrap;gap:10px;font-size:14px"><span style="flex:0 0 190px">${l}</span><span style="flex:1;height:8px;border-radius:99px;background:var(--line2);overflow:hidden"><span style="display:block;height:100%;width:${p/why[0][1]*100}%;background:var(--blue);border-radius:99px"></span></span><b style="flex:0 0 36px;text-align:right">${p}%</b></div>`).join('')}</section>
      ${d==='Sales'?`<section class="card stack" style="padding:18px;gap:10px"><h2 class="h" style="font-size:16px">From chat to customer</h2>
        ${funnel.map(([l,v])=>`<div class="row" style="flex-wrap:nowrap;gap:10px;font-size:14px"><span style="flex:0 0 170px">${l}</span><span style="flex:1;height:8px;border-radius:99px;background:var(--line2);overflow:hidden"><span style="display:block;height:100%;width:${v/236*100}%;background:var(--ok);border-radius:99px"></span></span><b style="flex:0 0 36px;text-align:right">${v}</b></div>`).join('')}</section>`:d==='Support'?supportCard():''}
      <section class="card tblwrap"><table class="tbl"><thead><tr><th>Person</th><th>Chats</th><th>First reply</th><th>Solved</th><th>Rating</th></tr></thead><tbody>
        ${[['Gunjan',64,'3 min',58,'4.8','Support'],['Ranjana',47,'6 min',41,'4.4','Support'],['Abhinandan',26,'5 min',24,'4.7','Sales'],['Sachin',15,'2 min',15,'4.6','Sales']].filter(r=>d==='all'||r[5]===d).map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]} ★</td></tr>`).join('')}</tbody></table></section>
    </div>`;
}

const SCREENS={home,inbox,tickets,kb,agent,team,alerts,reports};
function render(){
  if(!owner()&&['agent','team','alerts','reports'].includes(S.screen)) S.screen='home';
  const root=document.getElementById('root'); const y=window.scrollY;
  root.innerHTML=`<div class="app">${sidebar()}<div class="main">${topbar()}<main class="content" id="main">${SCREENS[S.screen]()}</main></div></div>${S.drawer?'<div class="scrim" data-a="menu"></div>':''}${tabbar()}
    <div class="toasts" aria-live="polite">${S.toasts.map((t,i)=>`<div class="toast"><span style="flex:1"><b>${esc(t.t)}</b>${t.s?`<span style="opacity:.8;font-size:13px">${esc(t.s)}</span>`:''}${t.to?`<br><button data-a="open" data-v="${t.to}">Open chat</button>`:''}</span><button aria-label="Dismiss" data-a="untoast" data-v="${i}" style="margin:0;padding:2px 6px">${ic('x',14)}</button></div>`).join('')}</div>`;
  window.scrollTo(0,y);
  const th=document.getElementById('thread'); if(th) th.scrollTop=th.scrollHeight;
}
function go(s){ Object.assign(S,{screen:s,drawer:false,switchOpen:false,bellOpen:false,mChat:false,mDetails:false}); render(); window.scrollTo(0,0); }
function toast(t,s,to){ S.toasts.push({t,s,to}); render(); setTimeout(()=>{ S.toasts.shift(); render(); },5000); }
const nowT=()=>{const d=new Date();return d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'}).toUpperCase();};
function sysMsg(c,t){ c.msgs.push({f:'sys',t,at:nowT()}); }

// ---------- events ----------
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(!el){ if(S.switchOpen||S.bellOpen){S.switchOpen=false;S.bellOpen=false;render();} return; }
  const a=el.dataset.a, v=el.dataset.v, c=conv(S.active);
  switch(a){
    case 'go': return go(v);
    case 'menu': S.drawer=!S.drawer; return render();
    case 'switch': S.switchOpen=!S.switchOpen; S.bellOpen=false; return render();
    case 'bell': S.bellOpen=!S.bellOpen; S.switchOpen=false; return render();
    case 'bell-m': S.bellOpen=!S.bellOpen; render(); return window.scrollTo(0,0);
    case 'readall': S.notes.forEach(n=>n.unread=false); return render();
    case 'note': { const n=S.notes[+v]; n.unread=false; S.bellOpen=false; if(n.to==='kb'){S.kbTab='unanswered';return go('kb');} S.active=n.to; S.filter='all'; go('inbox'); S.mChat=true; return render(); }
    case 'role': S.role=v; S.drawer=false; return render();
    case 'online': S.online=!S.online; return toast(S.online?'You are online':'You are away','New chats '+(S.online?'can come to you':'will skip you'));
    case 'toast': return toast(v);
    case 'untoast': S.toasts.splice(+v,1); return render();
    case 'filter': S.filter=v; return render();
    case 'dept': S.dept=v; return render();
    case 'crm': { const x=conv(v); addCrm(x); return toast('Added to CRM',x.name+' is now a lead in WhatsApp Automation · Stage: New lead'); }
    case 'crmall': { const r=crmReady(); r.forEach(addCrm); return toast(r.length+' leads added to CRM','Stage: New lead · Source: Website AI chat'); }
    case 'autocrm': S.autoCrm=!S.autoCrm; return toast(S.autoCrm?'Auto-add is on':'Auto-add is off',S.autoCrm?'New Sales chats with a mobile number go to the CRM by themselves':'Add sales leads to the CRM yourself');
    case 'open': { const x=conv(v); x.unread=0; S.active=v; S.draft=''; S.mode='reply'; S.srOpen=false; if(!FILTERS.find(f=>f[0]===S.filter)[2](x)) S.filter='all'; if(!inDept(x)) S.dept='all'; if(S.screen!=='inbox'){ go('inbox'); } S.mChat=true; S.mDetails=false; S.toasts=S.toasts.filter(t=>t.to!==v); return render(); }
    case 'm-back': S.mChat=false; S.mDetails=false; return render();
    case 'm-details': S.mDetails=!S.mDetails; return render();
    case 'takeover': c.status='open'; c.ai=false; c.owner=owner()?ME:'Gunjan'; if(!c.ticket) c.ticket='#HD-'+(tid++); sysMsg(c,(owner()?'You':'Gunjan')+' took over · AI is paused for this chat · Ticket '+c.ticket+' created'); return render();
    case 'resolve': c.status='resolved'; S.draft=''; sysMsg(c,'Resolved by '+(owner()?'you':'Gunjan')+' · Rating request sent to the customer'); render(); setTimeout(()=>{ c.csat=5; sysMsg(c,'Customer rated ★★★★★'); render(); },2500); return;
    case 'reopen': c.status='open'; sysMsg(c,'Reopened'); return render();
    case 'mode': S.draft=(document.getElementById('draft')||{}).value||''; S.mode=v; S.srOpen=false; return render();
    case 'sr': S.draft=(document.getElementById('draft')||{}).value||''; S.srOpen=!S.srOpen; return render();
    case 'saved': S.draft=SAVED[+v][1]; S.srOpen=false; render(); { const d=document.getElementById('draft'); d.focus(); d.setSelectionRange(d.value.length,d.value.length); } return;
    case 'kbtab': S.kbTab=v; S.faqNew=null; if(S.screen!=='kb') return go('kb'); return render();
    case 'faqnew': S.faqNew=''; S.kbTab=S.kbTab==='sources'?'faqs':S.kbTab; return render();
    case 'faqcancel': S.faqNew=null; return render();
    case 'answer': S.faqNew=UNANSWERED[+v].q; S.answering=+v; render(); return document.querySelector('#faqf textarea').focus();
    case 'faqdel': FAQS.splice(+v,1); return toast('FAQ removed');
    case 'rule': S.rules[v]=!S.rules[v]; return render();
    case 'tog': S[v]=!S[v]; return render();
    case 'saveagent': S.agentName=document.getElementById('ag-name').value.trim()||S.agentName; S.tone=document.getElementById('ag-tone').value; return toast('AI agent saved','The widget uses the new settings right away');
    case 'invite': S.invite=!S.invite; return render();
    case 'assign': S.assign=v; return render();
    case 'ch': S.ch[v]=!S.ch[v]; return render();
    case 'saverem': document.querySelectorAll('[data-k]').forEach(i=>S.remind[i.dataset.k]=+i.value||S.remind[i.dataset.k]); return toast('Reminders saved','Reminder after '+S.remind.first+' min, owner alert after '+S.remind.owner+' min');
  }
});
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.closest('tr[data-a]')) e.target.closest('tr[data-a]').click(); if(e.key==='Escape'&&(S.srOpen||S.bellOpen||S.switchOpen)){S.srOpen=S.bellOpen=S.switchOpen=false;render();} });
document.addEventListener('input',e=>{
  if(e.target.id!=='draft') return;
  const val=e.target.value, open=val==='/'||(val.startsWith('/')&&!val.includes(' '));
  S.draft=val;
  if(open!==S.srOpen){ S.srOpen=open; render(); const d=document.getElementById('draft'); d.focus(); d.setSelectionRange(val.length,val.length); }
});
document.addEventListener('change',e=>{
  const c=conv(S.active); if(!c) return;
  const id=e.target.id;
  if(id==='wa') S.wa=e.target.checked;
  if(id==='d-status'){ c.status=e.target.value; sysMsg(c,'Status changed to '+STATUS[c.status][0]); render(); }
  if(id==='d-owner'){ c.owner=e.target.value; sysMsg(c,c.owner?'Assigned to '+c.owner:'Unassigned'); if(c.owner&&c.status==='human') c.status='open'; render(); if(c.owner&&c.owner!==ME) toast(c.owner+' was notified','In the browser, mobile app and WhatsApp'); }
  if(id==='d-team'){ c.team=e.target.value; sysMsg(c,'Marked as '+c.team); if(!inDept(c)) S.dept='all'; render(); }
  if(id==='d-prio'){ c.prio=e.target.value; render(); }
});
document.addEventListener('submit',e=>{
  e.preventDefault(); const f=e.target;
  if(f.id==='replyf'){
    const t=(document.getElementById('draft').value||'').trim(); if(!t) return;
    const c=conv(S.active); const who=owner()?ME:'Gunjan';
    if(S.mode==='note'){ c.msgs.push({f:'note',who,t,at:nowT()}); }
    else {
      if(c.status==='ai'){ c.ai=false; if(!c.ticket) c.ticket='#HD-'+(tid++); sysMsg(c,who+' took over · AI is paused for this chat'); }
      if(!c.owner) c.owner=who;
      c.msgs.push({f:'agent',who,t,at:nowT(),wa:S.wa&&!!c.phone});
      if(c.status==='human'||c.status==='ai') c.status='open';
      c.wait=0;
      setTimeout(()=>{ if(c.status==='resolved') return; c.msgs.push({f:'customer',t:'Okay, thank you!',at:nowT()}); if(S.active!==c.id||S.screen!=='inbox') { c.unread=(c.unread||0)+1; S.notes.unshift({t:'Customer replied',s:c.name,to:c.id,kind:'blue',unread:true}); } render(); },3500);
    }
    S.draft=''; S.srOpen=false; render(); const d=document.getElementById('draft'); if(d) d.focus(); return;
  }
  if(f.id==='faqf'){
    FAQS.unshift({q:f.elements.q.value.trim(),a:f.elements.a.value.trim(),cat:f.elements.c.value,used:0});
    if(S.faqNew&&S.answering!=null){ UNANSWERED.splice(S.answering,1); S.answering=null; }
    S.faqNew=null; S.kbTab='faqs'; return toast('FAQ saved','The AI will use this answer from now on');
  }
  if(f.id==='invf'){ S.team.push({n:f.elements.n.value.trim(),role:f.elements.r.value,team:f.elements.t.value,on:false,open:0}); S.invite=false; return toast('Invite sent','They get a link by email and WhatsApp'); }
});

// ---------- live demo events ----------
setTimeout(()=>{
  const id='c8';
  CONVS.unshift({id,ticket:'',name:'Visitor 5203',phone:'',email:'',page:'/pricing',city:'Lucknow',team:'Sales',cat:'Question',prio:'Normal',status:'ai',owner:'',wait:0,sla:10,unread:1,ai:true,reason:'',subject:'Setup help in Hindi',
    msgs:[{f:'customer',t:'Do you help with setup in Hindi?',at:nowT()},{f:'ai',t:'Yes! Our team helps with setup in Hindi and English, and connects your number for you.',at:nowT()}]});
  render();
  setTimeout(()=>{
    const c=conv(id); c.name='Deepak Yadav'; c.phone='+91 94150 33871'; c.msgs.push({f:'customer',t:'Talk to Sales',at:nowT()});
    sysMsg(c,'Customer clicked "Talk to Sales" · Waiting for a person'); c.status='human'; c.reason='Customer clicked "Talk to Sales"'; c.ticket='#HD-'+(tid++); c.subject='Setup help in Hindi'; c.crm=false; if(S.autoCrm) addCrm(c);
    S.notes.unshift({t:'New chat needs a person',s:'Deepak Yadav · Talk to Sales',to:id,kind:'bad',unread:true});
    toast('New chat needs a person','Deepak Yadav · Talk to Sales',id);
  },9000);
},12000);
setTimeout(()=>{ const c=conv('c1'); if(c.status==='human'){ c.wait=10; S.notes.unshift({t:'Reply overdue',s:'Rohan Mehta waited 10 min',to:'c1',kind:'bad',unread:true}); toast('Reminder: reply overdue','Rohan Mehta has waited 10 minutes','c1'); } },35000);

render();
})();
</script>
