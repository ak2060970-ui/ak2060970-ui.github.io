<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log in | Simple Floww</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<link rel="stylesheet" href="/assets/style.css?v=7">
<style>
  body{background:var(--tint);min-height:100vh;display:flex;flex-direction:column}
  .auth{flex:1;display:flex;align-items:center;justify-content:center;padding:32px max(20px,env(safe-area-inset-left,0px))}
  .auth-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:32px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 50px rgba(1,11,72,.08)}
  .auth-card h1{font-size:28px}
  .demo-note{background:#fff7e6;border:1px solid #fde3a7;color:#6b4300;border-radius:12px;padding:10px 14px;font-size:14px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-weight:600;font-size:14px}
  .field input{border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:16px;min-height:48px}
  .field input:focus{outline:2px solid var(--royal);outline-offset:1px}
  .field input[type=checkbox]{min-height:0;width:18px;height:18px;padding:0;border-radius:4px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
  .full{width:100%;justify-content:center}
  .or{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:13px}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
  .demo-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .demo-btns a{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;text-decoration:none;font-weight:600;font-size:14px;background:#fff}
  .demo-btns a:hover{border-color:var(--royal);color:var(--royal)}
  .demo-btns span{display:block;font-weight:400;font-size:12.5px;color:var(--ink-3)}
  .foot{text-align:center;font-size:14px;color:var(--ink-2)}
  .foot a{color:var(--royal);font-weight:600}
</style>
</head>
<body>
<div class="auth">
  <main class="auth-card">
    <a href="/" aria-label="Simple Floww home"><img src="/assets/logo.png" alt="Simple Floww" width="183" height="27"></a>
    <h1>Log in to your panel</h1>
    <p class="demo-note"><b>Demo version.</b> No real account is needed. Use any email and password. Nothing you type is saved or sent anywhere.</p>
    <form id="login" class="field" style="gap:14px" novalidate>
      <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="off" placeholder="you@business.com"></div>
      <div class="field"><label for="pass">Password</label><input id="pass" type="password" autocomplete="off" placeholder="Your password"></div>
      <div class="row"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox"> Keep me logged in</label><a href="#" style="color:var(--royal);font-weight:600">Forgot password?</a></div>
      <button class="btn btn-pri full" type="submit">Log in</button>
    </form>
    <div class="or">or open the demo as</div>
    <div class="demo-btns">
      <a href="/app/">Owner<span>Full panel</span></a>
      <a href="/app/#agent">Sales agent<span>Limited menu</span></a>
    </div>
    <p class="foot">New to Simple Floww? <a href="/signup/">Start free trial</a></p>
  </main>
</div>
<script>
document.getElementById('login').addEventListener('submit', function(e){ e.preventDefault(); location.href = '/app/'; });
</script>
</body>
</html>
