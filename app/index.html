<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<style>html,body{margin:0;height:100%}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Simple Floww Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: app shell — fixed-width sidebar + fluid main; sidebar becomes a top strip on phones. Single light brand look (Simple Floww tokens). */
:root{
  --navy:#0a0f47; --blue:#0a1ef5; --cyan:#06d6fa; --green:#25d366;
  --tint-blue:#e7eafe; --tint-cyan:#def8fe; --cloud:#f4f8ff; --paper:#ffffff;
  --slate:#4a5275; --line:#dfe5f5; --line2:#edf1fa;
  --warn-bg:#fff1de; --warn:#8a4b00; --bad-bg:#fde8ea; --bad:#a3262f; --ok-bg:#e3f9eb; --ok:#0b6b34;
  --f-display:"Plus Jakarta Sans","Helvetica Neue",Arial,sans-serif;
  --f-body:Inter,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--cloud)}
body{color:var(--navy);font-family:var(--f-body);font-size:14.5px;line-height:1.5}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.h{font-family:var(--f-display);color:var(--navy);margin:0;text-wrap:balance}
.muted{color:var(--slate)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px}
.btn{border:1px solid #cfd7f0;background:#fff;color:var(--navy);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;min-height:40px;display:inline-flex;align-items:center;gap:8px;justify-content:center;white-space:nowrap}
.btn:hover{background:var(--cloud)}
.btn-p{background:var(--blue);border-color:var(--blue);color:#fff}.btn-p:hover{background:#0816c4}
.btn-g{background:var(--green);border-color:var(--green);color:var(--navy)}.btn-g:hover{background:#1fbf5b}
.btn-q{border:0;background:transparent;color:var(--blue);padding:6px 8px;min-height:32px}.btn-q:hover{background:var(--tint-blue)}
.chip{border:1px solid #cfd7f0;background:#fff;color:var(--navy);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500;min-height:36px}
.chip:hover{border-color:var(--blue)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.p-blue{background:var(--tint-blue);color:var(--blue)}.p-cyan{background:var(--tint-cyan);color:var(--navy)}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-bad{background:var(--bad-bg);color:var(--bad)}.p-grey{background:#f1f2f6;color:var(--slate)}
.inp{border:1px solid #cfd7f0;border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;color:var(--navy);background:#fff;min-height:42px;width:100%}
.lbl{font-size:13px;font-weight:600;display:block;margin-bottom:6px}
.bar{height:8px;border-radius:999px;background:var(--tint-blue);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:999px}
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:600;color:var(--slate);font-size:12.5px;padding:10px 14px;border-bottom:1px solid var(--line);background:#f8faff;white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.av{border-radius:999px;background:var(--tint-blue);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.grid{display:grid;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stack{display:flex;flex-direction:column}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:transparent;padding:10px 14px;font-weight:600;font-size:14.5px;min-height:44px;margin-bottom:-1px;color:var(--slate);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--blue);border-bottom-color:var(--blue)}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg .btn{border-color:transparent;min-height:34px}
.seg .btn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.box{text-align:left;border-radius:12px;padding:14px;min-height:64px;border:1px solid #cfd7f0;background:#fff;width:100%}
.box.on{border:2px solid var(--blue);background:var(--cloud)}
.cal-scroll{overflow-x:auto;padding-bottom:4px}
.cal-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;min-width:840px}
.cal-col{background:#eef2fb;border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:340px;min-width:0}
.cal-col.today{background:#e7eafe;box-shadow:inset 0 0 0 2px var(--blue)}
.cal-dh{border:0;background:none;display:flex;flex-direction:column;align-items:flex-start;padding:2px 4px 6px;color:var(--slate);font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.cal-dh b{font-family:var(--f-display);font-size:20px;color:var(--navy)}
.cal-col.today .cal-dh b{color:var(--blue)}
.cal-ev{display:flex;flex-direction:column;gap:1px;text-align:left;border:0;border-left:3px solid var(--c);background:#fff;border-radius:8px;padding:6px 8px;font:inherit;color:var(--navy);cursor:pointer;width:100%;min-width:0}
.cal-ev:hover{background:var(--bg)}
.cal-ev.done{opacity:.55}.cal-ev.done .cal-ev-n{text-decoration:line-through}
.cal-ev-t{font-size:11.5px;font-weight:600;color:var(--c)}
.cal-ev-n{font-size:13px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.cal-ev-m{font-size:11.5px;color:var(--slate);line-height:1.3}
.cal-empty{font-size:12px;color:var(--slate);padding:4px}
.cal-add{margin-top:auto;border:1px dashed #b9c3e6;background:transparent;border-radius:8px;min-height:32px;font:inherit;font-size:12.5px;color:var(--slate);cursor:pointer}
.cal-add:hover{color:var(--blue);border-color:var(--blue)}
.cal-mh,.cal-mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-mh span{font-size:12px;font-weight:600;color:var(--slate);padding:0 6px}
.cal-cell{min-height:96px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:4px;text-align:left;font:inherit;color:var(--navy);cursor:pointer;min-width:0}
.cal-cell.out{background:transparent;opacity:.5}
.cal-cell.today .cal-num{background:var(--blue);color:#fff}
.cal-cell.sel{box-shadow:inset 0 0 0 2px var(--navy)}
.cal-num{font-size:13px;font-weight:700;width:24px;height:24px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex:none}
.cal-dots{display:none;gap:3px;flex-wrap:wrap;justify-content:center}.cal-dots i{width:6px;height:6px;border-radius:99px}
.cal-mini{display:flex;flex-direction:column;gap:2px;font-size:11.5px;min-width:0}
.cal-mini span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.cal-dot{width:8px;height:8px;border-radius:99px;display:inline-block;margin-right:6px}
.cal-modal{position:fixed;inset:0;background:rgba(10,15,71,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:80}
.cal-dialog{background:#fff;border-radius:18px;width:100%;max-width:480px;max-height:calc(100vh - 40px);overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:14px;margin:0}
.pick{cursor:pointer;position:relative}.pick input{position:absolute;opacity:0;width:1px;height:1px}
.pick:has(input:checked){background:var(--navy);color:#fff;border-color:var(--navy)}
.pick:has(input:focus-visible){outline:2px solid var(--blue);outline-offset:2px}
.lost-opt{display:flex;gap:10px;align-items:center;border:1px solid #cfd7f0;border-radius:10px;padding:10px 12px;cursor:pointer;font-size:14px}
.lost-opt:has(input:checked){border-color:var(--blue);background:#f4f8ff;box-shadow:inset 0 0 0 1px var(--blue)}
@media (max-width:820px){
  .cal-scroll{overflow:visible}
  .cal-week{grid-template-columns:1fr;min-width:0}
  .cal-col{min-height:0}
  .cal-dh{flex-direction:row;gap:8px;align-items:baseline}
  .cal-add{margin-top:0}
  .cal-mh,.cal-mg{gap:3px}
  .cal-mh span{text-align:center;padding:0}
  .cal-cell{min-height:52px;padding:4px 2px;align-items:center}
  .cal-mini{display:none}
  .cal-dots{display:flex}
  .cal-modal{align-items:flex-end;padding:0}
  .cal-dialog{border-radius:20px 20px 0 0;max-height:90vh;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
}
.ob-step{border:1px solid var(--line2);border-radius:14px;background:#fff}
.ob-step.cur{border:2px solid var(--blue);box-shadow:0 8px 24px -16px rgba(10,30,245,.5)}
.ob-head{display:flex;align-items:center;gap:14px;padding:12px 14px;width:100%;border:0;background:none;text-align:left;color:var(--navy)}
.ob-n{width:30px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex:0 0 30px;font-size:13px;font-weight:700;background:var(--tint-blue);color:var(--blue)}
.ob-step.done .ob-n{background:var(--green);color:var(--navy)}
.ob-body{padding:0 16px 16px 58px;display:flex;flex-direction:column;gap:14px}
@media (max-width:820px){.ob-body{padding:0 14px 14px}}
.ob-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.ob-opt{border:1px solid #cfd7f0;border-radius:12px;padding:12px 14px;text-align:left;background:#fff;color:var(--navy)}
.ob-opt.on{border:2px solid var(--blue);background:var(--cloud)}
.ob-need{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.ob-need div{display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.ob-need i{width:28px;height:28px;border-radius:8px;background:var(--tint-blue);color:var(--blue);display:flex;align-items:center;justify-content:center;flex:none;font-style:normal}
.btn-fb{background:#1877f2;border-color:#1877f2;color:#fff;font-weight:700}.btn-fb:hover{background:#1466d6}
.fb-f{font-family:Arial,sans-serif;font-size:19px;font-weight:700;line-height:1}
.fb-prog{height:4px;background:var(--line2);border-radius:99px;overflow:hidden}.fb-prog i{display:block;height:100%;background:#1877f2}
.ob-otp{font-size:24px;letter-spacing:10px;text-align:center;font-weight:700}
.ob-tick{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;border-radius:999px;padding:4px 10px;background:var(--line2);color:var(--slate)}
.ob-tick.on{background:var(--ok-bg);color:var(--ok)}
.ob-sw{width:46px;height:26px;border-radius:999px;border:0;position:relative;flex:none;background:#cfd7f0}
.ob-sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:999px;background:#fff;transition:left .15s}
.ob-sw.on{background:var(--blue)}.ob-sw.on::after{left:23px}
@keyframes obspin{to{transform:rotate(360deg)}}
.fu-people{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.fu-p{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:6px;color:var(--navy)}
.fu-p.on{border:2px solid var(--blue);background:var(--cloud)}
.fu-p .nums{display:flex;gap:10px;font-size:12.5px;color:var(--slate)}
.fu-row{display:flex;align-items:center;gap:12px;padding:12px 16px;flex-wrap:wrap}
.fu-own{border:1px solid var(--line);border-radius:999px;padding:3px 8px;font:inherit;font-size:13px;font-weight:600;background:#fff;color:var(--navy);max-width:150px}
.note-warn{background:var(--warn-bg);color:#5c3200;border-radius:10px;padding:10px 14px;font-size:13.5px}
h1.h{font-size:26px;font-weight:800;letter-spacing:-.4px}

/* shell */
.app{min-height:100%;display:flex;flex-wrap:wrap}
.side{flex:0 0 248px;background:#fff;border-right:1px solid var(--line);padding:20px 16px;display:flex;flex-direction:column;gap:16px;position:relative}
.main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column}
.top{background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.content{padding:28px 24px 48px;display:flex;flex-direction:column;gap:24px;max-width:1240px;width:100%}
.navlist{display:flex;flex-direction:column;gap:2px}
.navbtn{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:10px;padding:10px 12px;font-size:14.5px;text-align:left;min-height:44px;background:transparent;color:var(--slate);font-weight:500}
.navbtn:hover{background:var(--cloud)}
.navbtn.on{background:var(--tint-blue);color:var(--blue);font-weight:600}
.navbtn svg{flex:0 0 20px}
.navbtn .lab{flex:1}
.sep{height:1px;background:var(--line2);margin:10px 4px}
.switch{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:var(--cloud);border-radius:10px;padding:8px 12px;min-height:40px;font-size:13.5px;font-weight:600;color:var(--slate)}
.pop{position:absolute;z-index:20;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(10,15,71,.14);padding:8px;min-width:240px}
.wallet{display:flex;align-items:center;gap:8px;border:1px solid #cfd7f0;background:var(--tint-blue);color:var(--blue);border-radius:10px;padding:4px 4px 4px 12px;min-height:40px;font-weight:700}
.wallet .btn{min-height:32px;padding:5px 10px;font-size:13px}
.split{display:flex;gap:14px;align-items:stretch}
.side-user{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 6px;border-top:1px solid var(--line2)}

/* phone layout: drawer menu + bottom tab bar */
.m-only{display:none!important}
.tabbar,.scrim{display:none}
@media (max-width:820px){
  .m-only{display:inline-flex!important}
  .d-only{display:none!important}
  .app{display:block}
  .side{position:fixed;top:0;bottom:0;left:0;width:min(300px,86vw);z-index:70;transform:translateX(-105%);transition:transform .22s ease;overflow-y:auto;box-shadow:0 20px 50px rgba(10,15,71,.25);padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .side.open{transform:none}
  .scrim{display:block;position:fixed;inset:0;background:rgba(10,15,71,.45);z-index:65}
  .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;flex-wrap:nowrap;gap:6px;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(8px,env(safe-area-inset-left,0px))}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#fff;z-index:41}
  .top .wallet{padding:4px 10px;min-height:38px;font-size:13.5px}
  .top .wallet .btn,.top .wallet svg{display:none}
  .content{padding:16px max(16px,env(safe-area-inset-right,0px)) calc(100px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));gap:18px}
  h1.h{font-size:22px}
  .split{flex-direction:column}
  .split > *{flex-basis:auto!important}
  .chip-scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin-inline:-2px}
  .chip-scroll > *{flex:none}
  .tabbar{display:grid;position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid var(--line);grid-template-columns:repeat(5,minmax(0,1fr));padding:4px max(4px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px));box-shadow:0 -6px 20px rgba(10,15,71,.06)}
  .tabbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--slate);min-height:54px;position:relative;border-radius:10px}
  .tabbar button.on{color:var(--blue)}
  .tabbar button.on::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--blue)}
  .tabbar .b{position:absolute;top:4px;left:calc(50% + 6px);background:var(--blue);color:#fff;border-radius:999px;font-size:10px;line-height:16px;min-width:16px;padding:0 4px}
  .inbox-split .chatpane,.inbox-split .leadpane{display:none!important}
  .inbox-split.show-chat .listpane{display:none!important}
  .inbox-split.show-chat .chatpane{display:flex!important}
  .inbox-split.show-details .listpane,.inbox-split.show-details .chatpane{display:none!important}
  .inbox-split.show-details .leadpane{display:flex!important}
  .chatpane .chat-window{display:none!important}
  .tbl-cards thead{display:none}
  .tbl-cards,.tbl-cards tbody,.tbl-cards tr,.tbl-cards td{display:block;width:100%}
  .tbl-cards tr{border-bottom:1px solid var(--line2);padding:12px 16px}
  .tbl-cards tr:last-child{border-bottom:0}
  .tbl-cards td{border:0!important;padding:3px 0!important;min-width:0!important;white-space:normal!important}
  .tbl-cards td[data-label]::before{content:attr(data-label);display:block;font-size:11.5px;color:var(--slate);font-weight:600}
  .set-nav{flex-direction:row!important;overflow-x:auto;flex:0 0 auto!important;width:100%}
  .set-nav .navbtn{white-space:nowrap;width:auto;flex:none}
}
.help-fab{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:max(20px,env(safe-area-inset-bottom,0px));z-index:45;display:flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--blue);color:#fff;padding:12px 18px 12px 14px;font-weight:600;font-size:14.5px;box-shadow:0 10px 28px rgba(10,30,245,.35);min-height:48px}
.help-fab:hover{background:#0816c4}
.help-panel{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:max(20px,env(safe-area-inset-bottom,0px));z-index:45;width:380px;max-width:calc(100% - 32px);height:min(600px,calc(100% - 40px));background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 50px rgba(10,15,71,.22);display:flex;flex-direction:column;overflow:hidden}
.help-panel .tabs{flex:none}
@media (max-width:820px){
  .help-fab{bottom:calc(74px + env(safe-area-inset-bottom,0px));right:max(14px,env(safe-area-inset-right,0px));padding:12px;min-height:46px}
  .help-fab span{display:none}
  .help-panel{top:0;left:0;right:0;bottom:0;width:100%;max-width:none;height:100%;border-radius:0;border:0;z-index:80}
}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.navbtn{transition:background .12s,color .12s}}
</style>

<div id="app"></div>

<script>
(function(){
// ---------- icons ----------
const I = {
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  inbox:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',
  leads:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14.8c1.9.7 3.1 2.4 3.5 5.2"/>',
  followups:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  campaigns:'<path d="M3 10v4l11 5V5z"/><path d="M14 8a4 4 0 0 1 0 8"/><path d="M6 14.5V19h3v-3"/>',
  automations:'<rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 8V4"/><circle cx="9" cy="13.5" r="1"/><circle cx="15" cy="13.5" r="1"/>',
  reports:'<path d="M5 20V11M11 20V5M17 20v-6M3 20h18"/>',

  if (S.fuView === 'calendar') return `<div class="stack" style="gap:16px">${head}${byPerson}${calendar(true)}</div>`;

    ['Next 7 days','var(--slate)', mine.filter(e=>open(e)&&e.date>tomorrow&&e.date<=weekEnd)],
    ['Later','var(--slate)', mine.filter(e=>open(e)&&e.date>weekEnd)],
    ['Done today','var(--ok)', mine.filter(e=>e.done&&e.date===TODAY)]
  ].map(([l,c,items])=>[l,c,items.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))]).filter(g=>g[2].length);
  const base = CAL.filter(e => calMine(e) && open(e));
  const chips = [['all','All',base.length]].concat(Object.entries(CAL_TYPES).map(([k,T])=>[k,T.l,base.filter(e=>e.type===k).length]));

      ${owner() ? `<label class="row" style="gap:6px;flex-wrap:nowrap;font-size:12.5px"><span class="muted">Assigned</span><select class="fu-own" data-fuown="${e.id}" aria-label="Assigned to">${STAFF.map(n=>`<option${e.owner===n?' selected':''}>${n}</option>`).join('')}</select></label>` : ''}
      <span class="row" style="gap:6px;flex-wrap:nowrap">${e.lead?`<button class="btn" style="min-height:36px" data-act="nav" data-arg="inbox">Chat</button>`:''}<button class="btn${e.done?'':' btn-p'}" style="min-height:36px" data-act="cal-done" data-arg="${e.id}">${e.done?'Undo':'Done'}</button></span></div>`; };
  return `<div class="stack" style="gap:16px">${head}${byPerson}
    <div class="row chip-scroll" style="gap:6px">${chips.map(([k,l,n])=>`<button class="chip${S.calType===k?' on':''}" data-act="cal-type" data-arg="${k}">${k==='all'?'':`<span class="cal-dot" style="background:${CAL_TYPES[k].c}"></span>`}${l} · ${n}</button>`).join('')}</div>
    ${groups.map(([l,c,items])=>`<section class="card" style="overflow:hidden"><h2 class="h" style="font-size:15px;font-weight:700;color:${c};padding:12px 16px 10px">${l} · ${items.length}</h2>${items.map(row).join('')}</section>`).join('') || '<div class="card" style="padding:18px"><p class="muted" style="margin:0">Nothing to follow up. Use "+ Add follow-up" to plan one.</p></div>'}
  </div>`;
}

const TODAY = '2026-11-14';
const DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MON = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const pad2 = n => String(n).padStart(2,'0');
const isoD = d => d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addD = (s,n) => { const d = parseD(s); d.setDate(d.getDate()+n); return isoD(d); };
const weekStart = s => { const d = parseD(s); d.setDate(d.getDate()-(d.getDay()+6)%7); return isoD(d); };
const dayName = s => DOW[(parseD(s).getDay()+6)%7];
const shortDate = s => { const d = parseD(s); return `${dayName(s)}, ${d.getDate()} ${MON[d.getMonth()].slice(0,3)}`; };
const t12 = t => { const [h,m] = t.split(':').map(Number); return ((h+11)%12+1)+':'+pad2(m)+(h<12?' AM':' PM'); };
const calMine = e => (S.fuTeam === 'all' || e.team === S.fuTeam) && (owner() ? (S.fuPerson === 'all' || e.owner === S.fuPerson) : e.owner === 'Ranjana');
const calEvents = day => CAL.filter(e => e.date===day && calMine(e) && (S.calType==='all' || e.type===S.calType)).sort((a,b)=>a.time.localeCompare(b.time));

function calendar(embed){
  const view = S.calView, d = S.calDate;
  let label = '', body = '', range = [];
  if (view === 'week') {
    const ws = weekStart(d); range = [...Array(7)].map((_,i)=>addD(ws,i));
    const a = parseD(range[0]), b = parseD(range[6]);
    label = `${a.getDate()} ${MON[a.getMonth()].slice(0,3)} – ${b.getDate()} ${MON[b.getMonth()].slice(0,3)} ${b.getFullYear()}`;
    body = `<div class="cal-scroll"><div class="cal-week">${range.map(day=>{ const ev = calEvents(day); return `<div class="cal-col${day===TODAY?' today':''}">
      <button class="cal-dh" data-act="cal-day" data-arg="${day}" aria-label="Open ${shortDate(day)}"><span>${dayName(day)}</span><b>${parseD(day).getDate()}</b></button>
      ${ev.map(evChip).join('') || '<span class="cal-empty">Free</span>'}
      <button class="cal-add" data-act="cal-new" data-arg="${day}">+ Add</button></div>`; }).join('')}</div></div>`;
  } else if (view === 'month') {
    const f = parseD(d); f.setDate(1); const first = isoD(f);
    label = `${MON[f.getMonth()]} ${f.getFullYear()}`;
    const gs = weekStart(first);
    let cells = [...Array(42)].map((_,i)=>addD(gs,i));
    if (parseD(cells[35]).getMonth() !== f.getMonth()) cells = cells.slice(0,35);
    range = cells.filter(c => parseD(c).getMonth() === f.getMonth());
    body = `<div class="card" style="padding:12px"><div class="cal-mh" style="margin-bottom:6px">${DOW.map(x=>`<span>${x}</span>`).join('')}</div>
      <div class="cal-mg">${cells.map(day=>{ const dd = parseD(day), ev = calEvents(day); return `<button class="cal-cell${dd.getMonth()!==f.getMonth()?' out':''}${day===TODAY?' today':''}${day===d?' sel':''}" data-act="cal-pick" data-arg="${day}" aria-label="${shortDate(day)}, ${ev.length} planned">
        <span class="cal-num">${dd.getDate()}</span>
        <span class="cal-dots">${ev.slice(0,4).map(e=>`<i style="background:${CAL_TYPES[e.type].c}"></i>`).join('')}</span>
        <span class="cal-mini">${ev.slice(0,2).map(e=>`<span style="color:${CAL_TYPES[e.type].c}">${t12(e.time).replace(':00','')} ${e.title}</span>`).join('')}${ev.length>2?`<span class="muted" style="font-weight:500">+${ev.length-2} more</span>`:''}</span></button>`; }).join('')}</div></div>
      ${dayAgenda(d)}`;
  } else {
    range = [d]; label = `${shortDate(d)} ${parseD(d).getFullYear()}`;
    body = dayAgenda(d);
  }
  const inRange = CAL.filter(e => range.includes(e.date) && calMine(e) && !e.done);
  const late = CAL.filter(e => isLate(e) && calMine(e));
  const chips = [['all','All',inRange.length]].concat(Object.entries(CAL_TYPES).map(([k,T])=>[k,T.l,inRange.filter(e=>e.type===k).length]));
  return `<div class="stack" style="gap:14px">
    <div class="row" style="justify-content:space-between;gap:12px">
      ${embed ? '' : '<div><h1 class="h">Calendar</h1><p class="muted" style="margin:4px 0 0;font-size:14px">Follow-ups, meetings, reminders and tasks in one place</p></div>'}
      <div class="row"><div class="seg" role="group" aria-label="Calendar view">${[['day','Day'],['week','Week'],['month','Month']].map(([id,l])=>`<button class="btn${view===id?' on':''}" data-act="cal-view" data-arg="${id}" aria-pressed="${view===id}">${l}</button>`).join('')}</div>
      ${embed ? '' : `<button class="btn btn-p" data-act="cal-new" data-arg="${d}">+ Add</button>`}</div></div>
    <div class="row" style="justify-content:space-between;gap:10px">
      <div class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn" style="width:40px;padding:0" aria-label="Previous" data-act="cal-move" data-arg="-1">‹</button><button class="btn" data-act="cal-today">Today</button><button class="btn" style="width:40px;padding:0" aria-label="Next" data-act="cal-move" data-arg="1">›</button><strong style="font-size:16px;margin-left:6px;white-space:nowrap">${label}</strong></div>
      <div class="row chip-scroll" style="gap:6px">${chips.map(([k,l,n])=>`<button class="chip${S.calType===k?' on':''}" data-act="cal-type" data-arg="${k}">${k==='all'?'':`<span class="cal-dot" style="background:${CAL_TYPES[k].c}"></span>`}${l} · ${n}</button>`).join('')}</div>
    </div>
    ${late.length ? `<div class="note-warn row" style="justify-content:space-between;gap:8px"><span><b>${late.length} overdue:</b> ${late.map(e=>e.title).join(', ')}</span><button class="btn" style="min-height:34px" data-act="cal-day" data-arg="${late[0].date}">Show</button></div>` : ''}
    ${body}
  </div>`;
}

function aiAnswer(q){
  const s = q.toLowerCase();
  const map = [['reject','a10'],['template','a9'],['fail','a11'],['recharge','a14'],['invoice','a14'],['wallet','a14'],['24','a5'],['window','a5'],['import','a7'],['csv','a7'],['excel','a7'],['connect','a2'],['number','a2'],['login','a16'],['password','a16'],['invite','a15'],['team','a15'],['bot','a13'],['welcome','a12'],['follow','a8'],['quick','a6']];
  const hit = map.find(([k])=>s.includes(k));
  if (!hit) return {t:'I could not find an exact answer. Click "Talk to a person" and our team will reply here, or raise a ticket.'};
  const a = ARTICLES.find(x=>x.id===hit[1]);
  return {t:`<b>${a.t}</b><br>${a.steps.slice(0,3).map((x,i)=>(i+1)+'. '+x).join('<br>')}`, art:a.id};
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) { if (S.switchOpen){S.switchOpen=false;render();} return; }
  const a = el.dataset.act, v = el.dataset.arg;
  if (a==='video-close-bg' && e.target !== el) return;
  switch(a){
    case 'nav': S.calSel = null; S.calNew = null; if (v === 'calendar') { S.fuView = 'calendar'; return go('followups'); } return go(v);
    case 'fu-view': S.fuView = v; if (v === 'calendar') S.calView = S.calView || 'week'; return render();
    case 'fu-person': S.fuPerson = v; return render();
    case 'fu-team': S.fuTeam = v; return render();
    case 'cal-view': S.calView = v; return render();
    case 'cal-type': S.calType = v; return render();
    case 'cal-today': S.calDate = TODAY; return render();
    case 'cal-move': {
      const n = +v;
      if (S.calView === 'day') S.calDate = addD(S.calDate, n);
      else if (S.calView === 'week') S.calDate = addD(S.calDate, 7*n);
      else { const d = parseD(S.calDate); d.setDate(1); d.setMonth(d.getMonth()+n); S.calDate = isoD(d); }
      return render();
    }
    case 'cal-day': S.calDate = v; S.calView = 'day'; return render();
    case 'cal-pick': S.calDate = v; return render();
    case 'cal-ev': S.calSel = v; return render();
    case 'cal-new': S.calSel = null; S.calNew = v || S.calDate; return render();
    case 'cal-close': S.calSel = null; S.calNew = null; return render();
    case 'cal-close-bg': if (e.target !== el) return; S.calSel = null; S.calNew = null; return render();
    case 'cal-done': { const ev = CAL.find(x=>x.id===v); if (ev) ev.done = !ev.done; return render(); }
    case 'cal-next': { const ev = CAL.find(x=>x.id===v); if (ev) { ev.date = addD(ev.date < TODAY ? TODAY : ev.date, 1); S.calDate = ev.date; } S.calSel = null; return render(); }
    case 'lost-open': S.lostOpen = true; return render();
    case 'ob-mode': S.fbd.mode = v; return render();
    case 'ob-hide': S.ob.hidden = true; return render();
    case 'fb-open': S.fbOpen = true; S.fb = 0; S.ob.err = ''; return render();
    case 'fb-close': S.fbOpen = false; S.ob.err = ''; return render();
    case 'fb-close-bg': if (e.target !== el || S.fb === 6) return; S.fbOpen = false; S.ob.err = ''; return render();
    case 'fb-other': S.ob.err = 'In the real setup, Facebook lets you log in with another account here.'; return render();
    case 'fb-biz': fbKeep(); S.fbd.biz = v; S.ob.err = ''; return render();
    case 'fb-via': fbKeep(); S.fbd.via = v; return render();
    case 'fb-next': {
      fbKeep(); const d = S.fbd; S.ob.err = '';
      if (S.fb===1 && d.biz==='create' && !d.bizName) { S.ob.err = 'Enter your business name'; return render(); }
      if (S.fb===2 && !d.name) { S.ob.err = 'Enter a display name'; return render(); }
      if (S.fb===3) { const n = d.phone.replace(/\D/g,''); if (n.length!==10) { S.ob.err = 'Enter a 10-digit mobile number'; return render(); } d.phone = '+91 '+n.slice(0,5)+' '+n.slice(5); }
      if (S.fb===4 && !/^\d{6}$/.test(d.code)) { S.ob.err = 'Enter the 6-digit code'; return render(); }
      S.fb++; render();
      if (S.fb===6) setTimeout(()=>{ S.fbOpen = false; S.ob.num = true; S.waConnected = true; S.done.wa = true; render(); }, 2200);
      return;
    }
    case 'ob-send': {
      const n = ((document.getElementById('ob-to')||{}).value||'').replace(/\D/g,''); S.ob.err = '';
      if (n.length!==10) { S.ob.err = 'Enter your 10-digit WhatsApp number'; return render(); }
      if (S.fbd.phone.replace(/\D/g,'').endsWith(n)) { S.obTest.to = n; S.ob.err = 'Use a different number from the one you connected'; return render(); }
      S.obTest.to = n; S.obTest.st = 1; render();
      [[900,()=>S.obTest.st=2],[1900,()=>S.obTest.st=3],[3600,()=>{ S.obTest.reply=true; }],[5200,()=>{ S.ob.test=true; S.testSent=true; S.done.test=true; }]].forEach(([ms,f])=>setTimeout(()=>{ f(); if (S.screen==='home') render(); }, ms));
      return;
    }
    case 'ob-won': S.obWelcome = (document.getElementById('ob-wtext')||{}).value || S.obWelcome; S.obWelcomeOn = !S.obWelcomeOn; return render();
    case 'ob-finish': S.obWelcome = (document.getElementById('ob-wtext')||{}).value || S.obWelcome; S.ob.welcome = true; S.done.bot = true; return render();
    case 'lost-cancel': S.lostOpen = false; return render();
    case 'lost-close-bg': if (e.target !== el) return; S.lostOpen = false; return render();
    case 'menu': S.drawer = !S.drawer; return render();
    case 'm-back': S.mChat = false; S.mDetails = false; return render();
    case 'm-details': S.mDetails = !S.mDetails; S.mChat = !S.mDetails; render(); return window.scrollTo(0,0);
    case 'switch': S.switchOpen = !S.switchOpen; return render();
    case 'role':
      S.role = v;
      if (v==='agent'){ if (['campaigns','automations','reports','settings','setup'].includes(S.screen)) S.screen='home'; S.inboxTab='mine'; S.leadFilter='all'; }
      return render();
    case 'recharge': return go('settings',{setTab:'billing'});
    case 'go-setup': return go('setup');
    case 'go-test': return go('setup',{planApplied:true,waConnected:true,biz:S.biz||'Agency / Service',source:S.source||'Website',team:S.team||'2 to 5 people'});
    case 'go-automations': return go('automations',{autoTab:'bots'});
    case 'go-templates': return go('campaigns',{campTab:'templates'});
    case 'go-leads': return go('leads');
    case 'go-team': return go('settings',{setTab:'team'});
    case 'go-followups': return go('followups');
    case 'go-pending': return go('inbox',{inboxTab:'pending'});
    case 'ai-done': S.done[v]=true; return render();
    case 'video': {
      const vv = VIDEOS.find(x=>x.id===v) || (v==='camp' ? VIDEOS[7] : VIDEOS[+v]);
      S.video = {t:vv.t, d:vv.d};
      if (!S.watched.includes(vv.id)) S.watched.push(vv.id);
      return render();
    }
    case 'h-tab': S.article=null; S.helpQ=''; S.helpTab=v; S.ticketNew=!!el.dataset.new; S.wOpen=false; if (S.screen!=='help') return go('help',{helpTab:v,ticketNew:!!el.dataset.new}); render(); return window.scrollTo(0,0);
    case 'kb-cat': return go('help',{helpTab:'kb',kbCat:v,helpQ:''});
    case 'vid-cat': S.vidCat=v; return render();
    case 'article': return go('help',{article:v,helpQ:'',wOpen:false});
    case 'helpful': S.helpful[S.article]=v; return render();
    case 'h-search': S.helpQ=v; return render();
    case 't-cancel': S.ticketNew=false; return render();
    case 'w-open': S.wOpen=true; S.wTab=v||'home'; return render();
    case 'w-close': S.wOpen=false; S.wTicketNew=false; return render();
    case 'w-tab': S.wTab=v; S.wTicketNew=!!el.dataset.new; return render();
    case 'w-ask': S.wMsgs.push({me:1,t:v}); S.wMsgs.push(aiAnswer(v)); return render();
    case 'w-human': S.wHuman=true; S.wMsgs.push({me:1,t:'Talk to a person'}); S.wMsgs.push({who:'Simple Floww',t:'Connecting you to our team. Gunjan from support will reply here, usually within 10 minutes. We also created ticket '+addTicket('Chat: '+(S.wMsgs.filter(m=>m.me)[0]||{t:'Help request'}).t,'Getting started')+' so you can track it.'}); return render();
    case 'video-close': case 'video-close-bg': S.video=null; return render();
    case 'answer': S[el.dataset.key]=v; return render();
    case 'apply-plan': S.planApplied=true; S.done.profile=true; S.done.bot=true; return render();
    case 'restart': S.biz=S.source=S.team=null; return render();
    case 'connect': S.waConnected=true; S.done.wa=true; return render();
    case 'send-test': S.testSent=true; S.done.test=true; return render();
    case 'itab': S.inboxTab=v; S.activeChat=0; return render();
    case 'chat': S.activeChat=+v; S.mChat=true; S.mDetails=false; render(); return window.scrollTo(0,0);
    case 'lview': S.leadsView=v; return render();
    case 'lfilter': S.leadFilter=v; return render();
    case 'ctab': S.campTab=v; return render();
    case 'atab': S.autoTab=v; return render();
    case 'stab': S.setTab=v; return render();
    case 'ramt': S.recharge=+v; return render();
    case 'wiz-start': S.wizard=true; S.wstep=1; S.campSent=false; render(); return window.scrollTo(0,0);
    case 'wiz-close': S.wizard=false; return render();
    case 'wiz-back': if (S.wstep===1) S.wizard=false; else S.wstep--; return render();
    case 'wiz-next': S.wstep=Math.min(5,S.wstep+1); return render();
    case 'wiz-send': S.campSent=true; return render();
    case 'aud': S.aud=v; return render();
    case 'tpl': S.tpl=+v; return render();
    case 'when': S.when=v; return render();
  }
});
document.addEventListener('keydown', e => { if (e.key==='Escape' && (S.video||S.switchOpen||S.wOpen||S.drawer)){ if (S.video) S.video=null; else if (S.drawer) S.drawer=false; else S.wOpen=false; S.switchOpen=false; render(); } });

if (location.hash === "#setup") S.screen = "setup";
if (location.hash === "#agent") { S.role = "agent"; S.inboxTab = "mine"; }
render();
})();
</script>
</body>
</html>
